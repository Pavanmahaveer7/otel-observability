{{- if .Values.demo.enabled }}
{{- $ns := .Values.demo.namespace -}}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $ns }}
  labels: {{- include "obs.labels" . | nindent 4 }}
{{- /* Traffic enters through the nginx edge proxy when it's enabled. */}}
{{- $entry := "http://gateway:8080" }}
{{- if .Values.nginx.enabled }}
{{- $entry = printf "http://nginx.%s.svc:8080" .Values.nginx.namespace }}
{{- end }}
{{- $d := .Values.demo }}
{{- /*
  name      Deployment/Service name     role      binary role (-role=..., also service.name)
  replicas  pod count                   headless  extra headless Service (nginx resolves pods individually)
*/}}
{{- $services := list
  (dict "name" "gateway"  "role" "gateway"  "port" 8080 "replicas" $d.gatewayReplicas "headless" true
        "env" (dict "ORDERS_URL" "http://orders:8081" "SERVICE_VERSION" "0.1.0"))
  (dict "name" "orders"   "role" "orders"   "port" 8081 "replicas" 1
        "env" (dict "PAYMENTS_URL" "http://payments:8082"))
  (dict "name" "payments" "role" "payments" "port" 8082 "replicas" 1
        "env" (dict "PAYMENT_FAIL_RATE" (toString $d.paymentFailRate)))
  (dict "name" "loadgen"  "role" "loadgen"  "port" 0    "replicas" 1
        "env" (dict "GATEWAY_URL" $entry "RPS" (toString $d.loadgenRPS)))
}}
{{- if and .Values.nginx.enabled .Values.nginx.canary.enabled }}
{{- /* Canary: same binary as gateway, reports version 0.2.0, slower and buggier. */}}
{{- $services = append $services (dict "name" "gateway-v2" "role" "gateway" "port" 8080 "replicas" 1 "headless" true
      "env" (dict "ORDERS_URL" "http://orders:8081" "SERVICE_VERSION" $d.canary.version
                  "GATEWAY_EXTRA_LATENCY_MS" (toString $d.canary.extraLatencyMs)
                  "GATEWAY_FAIL_RATE" (toString $d.canary.failRate))) }}
{{- end }}
{{- range $services }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .name }}
  namespace: {{ $ns }}
  labels: {{- include "obs.labels" $ | nindent 4 }}
    app.kubernetes.io/name: {{ .name }}
spec:
  replicas: {{ .replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .name }}
        app.kubernetes.io/component: {{ .role }}
    spec:
      containers:
        - name: app
          image: {{ $.Values.demo.image }}
          imagePullPolicy: {{ $.Values.demo.imagePullPolicy }}
          args: ["-role={{ .role }}"]
          env:
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - name: POD_UID
              valueFrom: { fieldRef: { fieldPath: metadata.uid } }
            - name: POD_NAMESPACE
              valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
            # Send OTLP to the agent on this node (Service with internalTrafficPolicy: Local).
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://{{ include "obs.fullname" $ }}-otel-agent.{{ $.Release.Namespace }}.svc:4317
            - name: OTEL_EXPORTER_OTLP_INSECURE
              value: "true"
            # k8s.pod.uid lets the agent's k8sattributes processor find this pod.
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: k8s.pod.uid=$(POD_UID),k8s.pod.name=$(POD_NAME),k8s.namespace.name=$(POD_NAMESPACE)
            {{- range $k, $v := .env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          {{- if gt (int .port) 0 }}
          ports:
            - { name: http, containerPort: {{ .port }} }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
          {{- end }}
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { memory: 128Mi }
{{- if gt (int .port) 0 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .name }}
  namespace: {{ $ns }}
  labels: {{- include "obs.labels" $ | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: {{ .name }}
  ports:
    - { name: http, port: {{ .port }}, targetPort: http }
{{- end }}
{{- if .headless }}
---
# Headless: DNS returns every pod IP, so nginx load-balances (and logs) per pod.
apiVersion: v1
kind: Service
metadata:
  name: {{ .name }}-headless
  namespace: {{ $ns }}
  labels: {{- include "obs.labels" $ | nindent 4 }}
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: {{ .name }}
  ports:
    - { name: http, port: {{ .port }}, targetPort: http }
{{- end }}
{{- end }}
{{- end }}
