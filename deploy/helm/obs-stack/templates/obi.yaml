{{- if .Values.ebpf.enabled }}
{{- $name := printf "%s-obi" (include "obs.fullname" .) -}}
{{- $otlp := printf "http://%s-otel-agent.%s.svc.cluster.local:4318" (include "obs.fullname" .) .Release.Namespace -}}
# OpenTelemetry eBPF Instrumentation (OBI): kernel-level, zero-code telemetry.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  labels: {{- include "obs.labels" . | nindent 4 }}
---
# Read-only access so OBI can decorate telemetry with pod / owner / namespace metadata.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $name }}-{{ .Release.Namespace }}
  labels: {{- include "obs.labels" . | nindent 4 }}
rules:
  - apiGroups: ["apps"]
    resources: [replicasets]
    verbs: [list, watch]
  - apiGroups: [""]
    resources: [pods, services, nodes]
    verbs: [list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $name }}-{{ .Release.Namespace }}
  labels: {{- include "obs.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $name }}-{{ .Release.Namespace }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
  labels: {{- include "obs.labels" . | nindent 4 }}
data:
  obi-config.yml: |
    discovery:
      instrument:
        {{- range .Values.ebpf.namespaces }}
        - k8s_namespace: {{ . | quote }}
        {{- end }}
      exclude_instrument:
        {{- range .Values.ebpf.excludePods }}
        - k8s_pod_name: {{ . | quote }}
        {{- end }}
    attributes:
      kubernetes:
        enable: true
        cluster_name: {{ .Values.clusterName }}
      select:
        obi_network_flow_bytes:
          include:
            - direction
            - k8s.src.namespace
            - k8s.src.owner.name
            - k8s.src.owner.type
            - k8s.dst.namespace
            - k8s.dst.owner.name
            - k8s.dst.owner.type
    otel_traces_export:
      endpoint: {{ $otlp }}
      protocol: http/protobuf
    otel_metrics_export:
      endpoint: {{ $otlp }}
      protocol: http/protobuf
      interval: {{ .Values.ebpf.metricsInterval }}
    metrics:
      features:
        - application
        {{- if .Values.ebpf.networkMetrics }}
        - network
        {{- end }}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ $name }}
  labels: {{- include "obs.labels" . | nindent 4 }}
    app.kubernetes.io/name: obi
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: obi
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: obi
        app.kubernetes.io/instance: {{ .Release.Name }}
      annotations:
        checksum/config: {{ toYaml .Values.ebpf | sha256sum | trunc 16 }}
    spec:
      serviceAccountName: {{ $name }}
      hostPID: true            # see every process on the node
      hostNetwork: true        # network flows: watch the node's interfaces, not just this pod's
      dnsPolicy: ClusterFirstWithHostNet
      tolerations:
        - operator: Exists
      containers:
        - name: obi
          image: {{ .Values.ebpf.image }}
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: true   # loads eBPF programs into the kernel
          env:
            - { name: OTEL_EBPF_CONFIG_PATH, value: /config/obi-config.yml }
            - { name: OTEL_EBPF_LOG_LEVEL, value: info }
            # Capture flows with tc programs on every interface (incl. pod veths); the default
            # socket filter only saw OBI's own traffic on minikube's docker-in-WSL2 network.
            - { name: OTEL_EBPF_NETWORK_SOURCE, value: tc }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 768Mi }
          volumeMounts:
            - { name: config, mountPath: /config }
            - { name: tracefs, mountPath: /sys/kernel/tracing }
            # Pinned eBPF maps live in the host's BPF filesystem.
            - { name: bpffs, mountPath: /sys/fs/bpf, mountPropagation: Bidirectional }
      volumes:
        - name: bpffs
          hostPath: { path: /sys/fs/bpf, type: Directory }
        - name: config
          configMap: { name: {{ $name }} }
        - name: tracefs
          hostPath: { path: /sys/kernel/tracing, type: Directory }
{{- end }}
