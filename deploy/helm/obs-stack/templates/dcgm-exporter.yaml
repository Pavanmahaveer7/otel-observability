{{- if .Values.gpu.dcgmExporter.enabled }}
{{- $name := printf "%s-dcgm-exporter" (include "obs.fullname" .) -}}
# NVIDIA DCGM exporter on every GPU node. Host network so the node's OTel agent
# scrapes it at $(K8S_NODE_IP):{{ .Values.gpu.dcgmExporter.port }} (agent prometheus/node receiver).
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ $name }}
  labels: {{- include "obs.labels" . | nindent 4 }}
    app.kubernetes.io/name: dcgm-exporter
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: dcgm-exporter
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dcgm-exporter
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      runtimeClassName: {{ .Values.gpu.dcgmExporter.runtimeClassName }}
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      tolerations:
        - operator: Exists
      containers:
        - name: dcgm-exporter
          image: {{ .Values.gpu.dcgmExporter.image }}
          args: ["-f", "{{ .Values.gpu.dcgmExporter.countersFile }}"]
          env:
            - { name: DCGM_EXPORTER_LISTEN, value: ":{{ .Values.gpu.dcgmExporter.port }}" }
            # Map GPUs to the pods using them (via the kubelet pod-resources API).
            - { name: DCGM_EXPORTER_KUBERNETES, value: "true" }
            - { name: NVIDIA_VISIBLE_DEVICES, value: all }
            - { name: NVIDIA_DRIVER_CAPABILITIES, value: "compute,utility" }
          ports:
            - { name: metrics, containerPort: {{ .Values.gpu.dcgmExporter.port }} }
          securityContext:
            # Profiling metrics (SM/tensor activity, NVLink bandwidth) need SYS_ADMIN.
            capabilities:
              add: [SYS_ADMIN]
          readinessProbe:
            httpGet: { path: /health, port: {{ .Values.gpu.dcgmExporter.port }} }
            initialDelaySeconds: 20
            periodSeconds: 10
          volumeMounts:
            - { name: pod-resources, mountPath: /var/lib/kubelet/pod-resources, readOnly: true }
      volumes:
        - name: pod-resources
          hostPath: { path: /var/lib/kubelet/pod-resources }
{{- end }}
