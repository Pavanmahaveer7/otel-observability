{{- $name := printf "%s-otel-gateway" (include "obs.fullname" .) -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
  labels: {{- include "obs.labels" . | nindent 4 }}
data:
  config.yaml: |
{{ tpl (.Files.Get "files/otel-gateway.yaml") . | indent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels: {{- include "obs.labels" . | nindent 4 }}
    app.kubernetes.io/name: otel-gateway
spec:
  type: {{ .Values.otel.gateway.serviceType }}
  selector:
    app.kubernetes.io/name: otel-gateway
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    {{- if eq .Values.otel.gateway.serviceType "NodePort" }}
    - { name: otlp-grpc, port: 4317, targetPort: 4317, nodePort: {{ .Values.otel.gateway.nodePort }} }
    {{- else }}
    - { name: otlp-grpc, port: 4317, targetPort: 4317 }
    {{- end }}
    - { name: otlp-http, port: 4318, targetPort: 4318 }
    - { name: self-metrics, port: 8888, targetPort: 8888 }
    - { name: zpages, port: 55679, targetPort: 55679 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels: {{- include "obs.labels" . | nindent 4 }}
    app.kubernetes.io/name: otel-gateway
spec:
  # k8s_cluster and k8sobjects must run in exactly one place; keep 1 replica
  # (or move them to a dedicated single-replica "cluster" collector before scaling).
  replicas: {{ .Values.otel.gateway.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: otel-gateway
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: otel-gateway
        app.kubernetes.io/instance: {{ .Release.Name }}
      annotations:
        checksum/config: {{ tpl (.Files.Get "files/otel-gateway.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "obs.fullname" . }}-otel
      initContainers:
        # Wait for ClickHouse so the exporter can create its schema on start.
        - name: wait-clickhouse
          image: busybox:1.37
          command: ["sh", "-c", "until wget -qO- http://{{ include "obs.fullname" . }}-clickhouse:8123/ping; do echo waiting for clickhouse; sleep 3; done"]
      containers:
        - name: otelcol
          image: {{ .Values.otel.image }}
          imagePullPolicy: {{ .Values.otel.imagePullPolicy }}
          args: ["--config=/conf/config.yaml"]
          envFrom:
            - secretRef: { name: {{ include "obs.fullname" . }}-clickhouse }
          env:
            - name: GOMEMLIMIT
              value: 800MiB
          ports:
            - { name: otlp-grpc, containerPort: 4317 }
            - { name: otlp-http, containerPort: 4318 }
            - { name: self-metrics, containerPort: 8888 }
            - { name: health, containerPort: 13133 }
          readinessProbe:
            httpGet: { path: /, port: health }
          livenessProbe:
            httpGet: { path: /, port: health }
            initialDelaySeconds: 15
          resources: {{- toYaml .Values.otel.gateway.resources | nindent 12 }}
          volumeMounts:
            - { name: config, mountPath: /conf }
      volumes:
        - name: config
          configMap: { name: {{ $name }} }
