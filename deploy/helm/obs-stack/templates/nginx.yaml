{{- if .Values.nginx.enabled }}
{{- $ns := .Values.nginx.namespace -}}
{{- $conf := tpl (.Files.Get "files/nginx.conf") . -}}
{{- $locs := tpl (.Files.Get "files/nginx-locations.conf") . -}}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $ns }}
  labels: {{- include "obs.labels" . | nindent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx
  namespace: {{ $ns }}
  labels: {{- include "obs.labels" . | nindent 4 }}
data:
  nginx.conf: |
{{ $conf | indent 4 }}
  locations.conf: |
{{ $locs | indent 4 }}
  index.html: |
    <!doctype html>
    <html><head><meta charset="utf-8"><title>obs demo edge</title></head>
    <body style="font-family: sans-serif; max-width: 40em; margin: 3em auto">
      <h1>obs demo: nginx edge</h1>
      <p>This page is a static file served by nginx itself (path routing: <code>/static/</code>).</p>
      <ul>
        <li><a href="/api/catalog">/api/catalog</a> &mdash; cached at the edge (see the <code>X-Cache-Status</code> header)</li>
        <li><a href="/api/checkout">/api/checkout</a> &mdash; canary split between gateway v1 and v2</li>
      </ul>
    </body></html>
{{- if .Values.nginx.tls.enabled }}
---
# Self-signed certificate generated by Helm; reused across upgrades.
{{- $existing := lookup "v1" "Secret" $ns "nginx-tls" }}
apiVersion: v1
kind: Secret
metadata:
  name: nginx-tls
  namespace: {{ $ns }}
  labels: {{- include "obs.labels" . | nindent 4 }}
type: kubernetes.io/tls
data:
{{- if $existing }}
  tls.crt: {{ index $existing.data "tls.crt" }}
  tls.key: {{ index $existing.data "tls.key" }}
{{- else }}
{{- $cert := genSelfSignedCert "localhost" (list "127.0.0.1") (list "localhost" (printf "nginx.%s.svc" $ns) (printf "nginx.%s.svc.cluster.local" $ns)) 365 }}
  tls.crt: {{ $cert.Cert | b64enc }}
  tls.key: {{ $cert.Key | b64enc }}
{{- end }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: {{ $ns }}
  labels: {{- include "obs.labels" . | nindent 4 }}
    app.kubernetes.io/name: nginx
spec:
  replicas: {{ .Values.nginx.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: nginx
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nginx
      annotations:
        checksum/config: {{ print $conf $locs | sha256sum | trunc 16 }}
    spec:
      containers:
        - name: nginx
          image: {{ .Values.nginx.image }}
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 8080 }
            - { name: status, containerPort: 8081 }
            {{- if .Values.nginx.tls.enabled }}
            - { name: https, containerPort: 8443 }
            {{- end }}
          readinessProbe:
            httpGet: { path: /healthz, port: http }
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { memory: 192Mi }
          volumeMounts:
            - { name: config, mountPath: /etc/nginx/nginx.conf, subPath: nginx.conf }
            - { name: config, mountPath: /etc/nginx/locations.conf, subPath: locations.conf }
            - { name: config, mountPath: /usr/share/nginx/html/static/index.html, subPath: index.html }
            {{- if .Values.nginx.tls.enabled }}
            - { name: tls, mountPath: /etc/nginx/tls, readOnly: true }
            {{- end }}
      volumes:
        - name: config
          configMap: { name: nginx }
        {{- if .Values.nginx.tls.enabled }}
        - name: tls
          secret: { secretName: nginx-tls }
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: nginx
  namespace: {{ $ns }}
  labels: {{- include "obs.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: nginx
  ports:
    - { name: http, port: 8080, targetPort: http }
    - { name: status, port: 8081, targetPort: status }
    {{- if .Values.nginx.tls.enabled }}
    - { name: https, port: 8443, targetPort: https }
    {{- end }}
{{- end }}
