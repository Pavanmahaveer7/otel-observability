# nginx edge proxy config. Rendered by Helm via `tpl` (templates/nginx.yaml).
{{- $n := .Values.nginx }}
{{- $demo := printf "%s.svc.cluster.local" .Values.demo.namespace }}
load_module modules/ngx_otel_module.so;

worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  # ---- traces: one server span per request, sent to the node's OTel agent
  otel_exporter {
    # Fully qualified: the module's gRPC resolver doesn't apply the pod's DNS search domains.
    endpoint {{ include "obs.fullname" . }}-otel-agent.{{ .Release.Namespace }}.svc.cluster.local:4317;
  }
  otel_service_name nginx;
  otel_trace on;

  # ---- logs: JSON access log on stdout, parsed by the agent's file_log receiver.
  #   route         = upstream pool (gateway_stable / gateway_canary), empty for static
  #   upstream_addr = pod(s) tried; "a, b" means nginx retried on another pod
  #   cache         = HIT / MISS / EXPIRED for cached routes
  log_format otel_json escape=json
    '{"time":"$time_iso8601","request_id":"$request_id","remote_addr":"$remote_addr",'
    '"scheme":"$scheme","ssl_protocol":"$ssl_protocol","method":"$request_method",'
    '"uri":"$request_uri","status":$status,"bytes_sent":$body_bytes_sent,'
    '"request_time":$request_time,"upstream_response_time":"$upstream_response_time",'
    '"upstream_connect_time":"$upstream_connect_time","upstream_status":"$upstream_status",'
    '"upstream_addr":"$upstream_addr","route":"$proxy_host","cache":"$upstream_cache_status",'
    '"user_agent":"$http_user_agent","trace_id":"$otel_trace_id","span_id":"$otel_span_id"}';
  access_log /dev/stdout otel_json;

  # ---- DNS for per-pod upstreams (headless Services, re-resolved every 10s)
  resolver kube-dns.kube-system.svc.cluster.local valid=10s ipv6=off;

  # ---- load balancing: every gateway pod is an upstream server
  upstream gateway_stable {
    zone gateway_stable 64k;
    least_conn;
    server gateway-headless.{{ $demo }}:8080 resolve max_fails={{ $n.passiveHealth.maxFails }} fail_timeout={{ $n.passiveHealth.failTimeout }};
    keepalive 32;
  }
{{- if $n.canary.enabled }}
  upstream gateway_canary {
    zone gateway_canary 64k;
    server gateway-v2-headless.{{ $demo }}:8080 resolve max_fails={{ $n.passiveHealth.maxFails }} fail_timeout={{ $n.passiveHealth.failTimeout }};
    keepalive 16;
  }

  # ---- canary: {{ $n.canary.weight }}% of checkouts go to gateway-v2
  split_clients "${request_id}" $checkout_pool {
    {{ $n.canary.weight }}%  gateway_canary;
    *    gateway_stable;
  }
{{- else }}
  map $request_id $checkout_pool { default gateway_stable; }
{{- end }}

  # ---- rate limiting: per client IP on /api/*
  limit_req_zone $binary_remote_addr zone=per_client:10m rate={{ $n.rateLimit.rps }}r/s;
  limit_req_status 429;
  limit_req_log_level warn;

  # ---- edge cache (for GET /api/catalog)
  proxy_cache_path /tmp/nginx-cache levels=1:2 keys_zone=api_cache:10m max_size=100m inactive=60s use_temp_path=off;

  # ---- defaults for every proxied request
  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Request-ID $request_id;
  proxy_connect_timeout 1s;
  proxy_read_timeout {{ $n.upstreamTimeout }};
  # retries: only when it's safe and useful (pod unreachable / overloaded), never on timeout
  proxy_next_upstream error http_503;
  proxy_next_upstream_tries {{ $n.retryTries }};
  proxy_next_upstream_timeout 2s;

  server {
    listen 8080;
    include /etc/nginx/locations.conf;
  }
{{- if $n.tls.enabled }}

  server {
    listen 8443 ssl;
    ssl_certificate     /etc/nginx/tls/tls.crt;
    ssl_certificate_key /etc/nginx/tls/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    include /etc/nginx/locations.conf;
  }
{{- end }}

  # stub_status for the collector's nginx receiver (cluster-internal only).
  server {
    listen 8081;
    location = /status {
      otel_trace off;
      access_log off;
      stub_status;
    }
  }
}
