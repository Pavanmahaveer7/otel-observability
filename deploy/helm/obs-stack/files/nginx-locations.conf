# Routes shared by the HTTP (8080) and HTTPS (8443) servers. Rendered via `tpl`.
{{- $n := .Values.nginx }}

# Path routing: cached, read-only catalog -> stable gateway pool
location = /api/catalog {
  limit_req zone=per_client burst={{ $n.rateLimit.burst }} nodelay;
  otel_trace_context propagate;
  otel_span_name "nginx GET /api/catalog";
  proxy_cache api_cache;
  proxy_cache_valid 200 {{ $n.cacheTTL }};
  proxy_cache_lock on;
  proxy_cache_use_stale error timeout updating;
  add_header X-Cache-Status $upstream_cache_status always;
  proxy_pass http://gateway_stable;
}

# Path routing: everything else under /api -> canary split (stable / canary)
location /api/ {
  limit_req zone=per_client burst={{ $n.rateLimit.burst }} nodelay;
  otel_trace_context propagate;
  otel_span_name "nginx $request_method $uri";
  add_header X-Upstream-Pool $proxy_host always;
  proxy_pass http://$checkout_pool;
}

# Static files served by nginx itself (no backend involved)
location /static/ {
  otel_trace off;
  root /usr/share/nginx/html;
  expires 1m;
}

location = / {
  otel_trace off;
  return 302 /static/index.html;
}

location = /healthz {
  otel_trace off;
  access_log off;
  return 200 "ok\n";
}
